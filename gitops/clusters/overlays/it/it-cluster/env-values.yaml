# Per-cluster environment values for it-cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-env-values
  namespace: it
data:
  CONTROL_PLANE_VIP: "REPLACE_WITH_CONTROL_PLANE_VIP"   # e.g. 10.x.x.148
  LB_IP_START: "REPLACE_WITH_LB_IP_START"               # e.g. 10.x.x.149
  LB_IP_END: "REPLACE_WITH_LB_IP_END"                   # e.g. 10.x.x.151
  PC_URL: "REPLACE_WITH_PRISM_CENTRAL_URL"               # e.g. https://10.x.x.7:9440
  PRISM_ELEMENT: "REPLACE_WITH_PRISM_ELEMENT_CLUSTER"
  OS_IMAGE_NAME: "REPLACE_WITH_OS_IMAGE_NAME"
  NETWORK_NAME: "REPLACE_WITH_NETWORK_NAME"
